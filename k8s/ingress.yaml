apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitness-tracker-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http: 
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fitness-tracker-service
            port:
              number: 80